<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прайс | Elena Leluhina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <main class="price-section container">
    <!-- Ссылка "На главную" -->
    <a href="index.html" class="back-link">← НА ГЛАВНУЮ</a>

    <div class="grid">
      
      <!-- ТЕКСТ СЛЕВА (колонки 1–7) -->
      <div class="price-content">
        <h2>ПРАЙС</h2>
        
        <div class="price-list">
          <div class="price-item">
            <span class="price-name">Дневной макияж</span>
            <span class="price-val">2 500 ₽</span>
          </div>

          <div class="price-item">
            <span class="price-name">Вечерний / Смоки</span>
            <span class="price-val">3 500 ₽</span>
          </div>

          <div class="price-item">
            <span class="price-name">Свадебный образ</span>
            <span class="price-val">от 5 000 ₽</span>
          </div>

          <div class="price-item">
            <span class="price-name">Полный образ (Total Look)</span>
            <span class="price-val">от 3 700 ₽</span>
          </div>

          <div class="price-item">
            <span class="price-name">Выезд к клиенту</span>
            <span class="price-val">+1 500 ₽</span>
          </div>
        </div>

        <a href="https://t.me/elenaleluh" class="btn-primary price-btn">ЗАПИСАТЬСЯ</a>
      </div>

      <!-- ФОТО СПРАВА (колонки 7–12) -->
      <div class="price-img-box">
        <img src="assets/about.jpg" alt="Елена Лелюхина" class="profile-photo">
      </div>

    </div>
  </main>

</body>
</html>
